; Firmware der LED-Sanduhr (ESP32-WROOM-32, 16x32 WS2812B, ICM-20948, Touch)
; Bauen:      pio run            Aufspielen per USB:  pio run -t upload
; Prototyp mit nur einer 16x16-Matrix:  pio run -e prototyp16 -t upload

[env]
platform = espressif32@6.9.0          ; Arduino 2.0.17, Bootloader mit Rollback
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Zwei gleich große App-Plätze (je 1,9 MB) für Updates. Die Aufteilung lässt sich per Update
; nie mehr ändern - deshalb großzügig.
board_build.partitions = min_spiffs.csv
lib_deps =
  fastled/FastLED@3.7.8
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@1.3.2
  bblanchon/ArduinoJson@7.2.1
build_flags =
  !python3 ../tools/versions_flag.py

[env:sanduhr]
build_flags =
  ${env.build_flags}
  -DMATRIX_H=32

[env:prototyp16]
build_flags =
  ${env.build_flags}
  -DMATRIX_H=16
